# Config de Nginx para servir el frontend (SPA) y hacer de reverse proxy del
# backend GraphQL. Así el navegador habla con un solo origen (mismo host:puerto)
# y no hay URL de backend hardcodeada ni problemas de CORS. Funciona igual en
# local (docker) y en el VPS, con cualquier IP o dominio.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos del frontend. try_files cae a index.html para que el
    # ruteo del lado del cliente (SPA) no dé 404 al recargar una sub-ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API GraphQL: se reenvía al contenedor del backend por la red interna de
    # Docker ("backend" es el nombre del servicio en docker-compose.yml).
    location /graphql/ {
        proxy_pass http://backend:8080/graphql/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
