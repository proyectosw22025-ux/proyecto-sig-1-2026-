services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: transporte_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: josephfgj
    ports:
      - "5433:5432"   # 5432 lo usa tu Postgres nativo; el backend igual se conecta por la red interna (DB_HOST=db)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # El -h 127.0.0.1 es imprescindible: obliga a comprobar por TCP, que es
      # como se conecta el backend. Sin él, pg_isready usa el socket Unix, que
      # ya responde mientras Postgres se inicializa por primera vez (arranca un
      # servidor temporal para crear la BD y la extensión PostGIS). El
      # healthcheck daba OK antes de tiempo, el backend arrancaba, recibía
      # "Connection refused" y moría; solo pasaba en el primer `up`, con el
      # volumen vacío.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8080"
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    # DNS público: en algunos VPS la red interna de Docker no resuelve dominios,
    # y los seeders (seed_microcruz/seed_osm) necesitan salir a internet.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DB_HOST: db
      DB_NAME: transporte_db
      DB_USER: postgres
      DB_PASSWORD: josephfgj
      DB_PORT: "5432"
      ALLOWED_HOSTS: "*"   # acepta cualquier host (local o la IP/dominio del VPS)
    depends_on:
      db:
        condition: service_healthy
    # Red de seguridad: si el backend muere al arrancar (p. ej. porque la BD
    # todavía no aceptaba conexiones), se reintenta en vez de quedarse caído y
    # dejar el frontend respondiendo 502.
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
