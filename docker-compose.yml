services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: transporte_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: josephfgj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8080"
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: transporte_db
      DB_USER: postgres
      DB_PASSWORD: josephfgj
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
