services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: transporte_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: josephfgj
    ports:
      - "5433:5432"   # 5432 lo usa tu Postgres nativo; el backend igual se conecta por la red interna (DB_HOST=db)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8080"
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: transporte_db
      DB_USER: postgres
      DB_PASSWORD: josephfgj
      DB_PORT: "5432"
      ALLOWED_HOSTS: "*"   # acepta cualquier host (local o la IP/dominio del VPS)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
